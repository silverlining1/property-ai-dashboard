services:
  - type: web
    name: propai-property-manager
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    domains:
      - propertymanager.codealchemistlabs.com
    envVars:
      - key: NODE_ENV
        value: production
      # Required: the app refuses to start in production without it (16+ chars).
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEMO_USER
        value: demo
      # Optional: set DEMO_USE_CLAUDE=true and ANTHROPIC_API_KEY to use the live model instead of the offline mock.
      - key: DEMO_USE_CLAUDE
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
