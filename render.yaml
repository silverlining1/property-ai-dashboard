services:
  - type: web
    name: propai-property-manager
    env: node
    # The build needs devDependencies (vite, tsx, esbuild); NODE_ENV=production would make npm skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    domains:
      - propertymanager.codealchemistlabs.com
    envVars:
      - key: NODE_ENV
        value: production
      # PropAI platform API the console signs in against (used at build time by the client and at
      # runtime for the CSP). Deployed from silverlining1/property-management-agent's render.yaml.
      - key: VITE_PROPAI_API_URL
        value: https://api.propertymanager.codealchemistlabs.com
